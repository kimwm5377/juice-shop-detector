services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    expose:
      - "3000"
    networks:
      - internal

  detection-proxy:
    build: ./detection-proxy
    container_name: detection-proxy
    ports:
      - "8080:8080"
    environment:
      - JUICE_SHOP_URL=http://juice-shop:3000
      - PORT=8080
      # 현재 버전은 true여도 탐지 결과만 기록하는 log-only 모드입니다.
      - BLOCK_MODE=false
      - BLOCK_THRESHOLD=0.75
      # 동일 프록시 컨테이너 내부에서 ModSecurity + OWASP CRS를 탐지 전용으로 실행합니다.
      - CRS_ENABLED=true
      - CRS_SCAN_TIMEOUT_MS=2000
      - CRS_MAX_BODY_BYTES=1048576
      # 팀원 Honey/Deception 신호를 동일 Node 프록시 안에서 관찰 전용으로 실행합니다.
      - DECEPTION_ENABLED=true
      - DECEPTION_TOKEN_TTL_MS=3600000
      - DECEPTION_MAX_SESSIONS=5000
      - ENABLE_EXPERIMENT_RUN_ID=true
      - PAYLOAD_FINGERPRINT_KEY=${PAYLOAD_FINGERPRINT_KEY:-}
    depends_on:
      - juice-shop
    networks:
      - internal

networks:
  internal:
    driver: bridge
