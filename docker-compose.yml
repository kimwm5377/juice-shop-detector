version: "3.8"

services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    expose:
      - "3000"
    networks:
      - internal

  detection-proxy:
    build: ./detection-proxy
    container_name: detection-proxy
    ports:
      - "8080:8080"
    environment:
      - JUICE_SHOP_URL=http://juice-shop:3000
      - PORT=8080
      # true 로 바꾸면 고위험 세션 요청을 자동 차단(403)합니다. 기본은 탐지/로깅만 수행.
      - BLOCK_MODE=false
      - BLOCK_THRESHOLD=0.75
    depends_on:
      - juice-shop
    networks:
      - internal

networks:
  internal:
    driver: bridge
