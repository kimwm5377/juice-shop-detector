services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    expose:
      - "3000"
    networks:
      - internal

  detection-proxy:
    build: ./detection-proxy
    container_name: detection-proxy
    ports:
      - "8080:8080"
    volumes:
      - ./detection-proxy/data:/app/data
    environment:
      - JUICE_SHOP_URL=http://juice-shop:3000
      - PORT=8080
      # 현재 버전은 true여도 탐지 결과만 기록하는 log-only 모드입니다.
      - BLOCK_MODE=false
      - DETECTION_LEVEL=medium
      - CSRF_ALLOWED_ORIGINS=${CSRF_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      - SCHEMA_LEARNING_FILE=/app/data/schema-learning.json
      # 동일 프록시 컨테이너 내부에서 ModSecurity + OWASP CRS를 탐지 전용으로 실행합니다.
      - CRS_ENABLED=true
      - CRS_SCAN_TIMEOUT_MS=2000
      - CRS_MAX_BODY_BYTES=1048576
      # 팀원 Honey/Deception 신호를 동일 Node 프록시 안에서 관찰 전용으로 실행합니다.
      - DECEPTION_ENABLED=true
      - DECEPTION_TOKEN_TTL_MS=3600000
      - DECEPTION_MAX_SESSIONS=5000
      - ENABLE_EXPERIMENT_RUN_ID=true
      - PAYLOAD_FINGERPRINT_KEY=${PAYLOAD_FINGERPRINT_KEY:-}
      # 운영 환경에서는 반드시 충분히 긴 고정 HMAC key를 주입합니다.
      - DCID_HMAC_SECRET=${DCID_HMAC_SECRET:-}
      - DCID_TTL_MS=${DCID_TTL_MS:-2592000000}
      - DCID_COOKIE_SECURE=${DCID_COOKIE_SECURE:-false}
      # 기본 false: 클라이언트가 직접 보낸 X-Forwarded-For를 신뢰하지 않습니다.
      - TRUST_PROXY=${TRUST_PROXY:-false}
      # Juice Shop RS256 공개키를 제공한 경우에만 Account ID를 verified로 사용합니다.
      - ACCOUNT_JWT_PUBLIC_KEY=${ACCOUNT_JWT_PUBLIC_KEY:-}
      - ACCOUNT_ID_HASH_KEY=${ACCOUNT_ID_HASH_KEY:-}
      - RESOLVED_ACTOR_TTL_MS=${RESOLVED_ACTOR_TTL_MS:-604800000}
      - MAX_RESOLVED_ACTORS=${MAX_RESOLVED_ACTORS:-5000}
      - MAX_RESOLUTION_MEMBERSHIPS=${MAX_RESOLUTION_MEMBERSHIPS:-20000}
      - MAX_RESOLUTION_RELATED_LINKS=${MAX_RESOLUTION_RELATED_LINKS:-5}
    depends_on:
      - juice-shop
    networks:
      - internal

networks:
  internal:
    driver: bridge
