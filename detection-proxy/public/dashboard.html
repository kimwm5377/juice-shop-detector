<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>AI Attacker Detection Dashboard</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; background:#0f1117; color:#e5e7eb; margin:0; padding:24px; }
  h1 { font-size:20px; margin-bottom:4px; }
  p.sub { color:#9ca3af; margin-top:0; font-size:13px; }
  table { width:100%; border-collapse:collapse; margin-top:16px; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid #262a35; }
  th { color:#9ca3af; font-weight:600; position:sticky; top:0; background:#0f1117; }
  tr:hover { background:#171a23; }
  .badge { padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .human { background:#14532d; color:#86efac; }
  .suspicious { background:#78350f; color:#fdba74; }
  .likely-ai-bot { background:#7f1d1d; color:#fca5a5; }
  .score-bar { background:#1f2330; border-radius:4px; overflow:hidden; width:100px; height:8px; display:inline-block; vertical-align:middle; margin-right:6px; }
  .score-fill { height:100%; background:linear-gradient(90deg,#22c55e,#eab308,#ef4444); }
  code { color:#93c5fd; }
  tr.session-row { cursor:pointer; }
  .toolbar { margin-top:12px; }
  .toolbar a { color:#93c5fd; font-size:13px; text-decoration:none; margin-right:16px; }
  .toolbar a:hover { text-decoration:underline; }
  .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:10; }
  .modal { position:fixed; top:5%; left:50%; transform:translateX(-50%); width:min(900px,92vw); max-height:88vh; overflow:auto; background:#131722; border:1px solid #262a35; border-radius:10px; padding:20px; z-index:11; }
  .modal h2 { margin-top:0; font-size:16px; }
  .modal .close { float:right; cursor:pointer; color:#9ca3af; }
  .path-item { border-left:2px solid #262a35; padding:8px 0 8px 12px; margin-bottom:4px; font-size:12px; }
  .path-item .meta { color:#9ca3af; }
  .path-item .url { color:#e5e7eb; font-weight:600; }
  .path-item .status-404 { color:#fca5a5; }
  .path-item .status-2xx { color:#86efac; }
  .path-item .body { color:#93c5fd; margin-top:2px; word-break:break-all; }
  .tag { display:inline-block; background:#7f1d1d; color:#fca5a5; font-size:10px; padding:1px 6px; border-radius:999px; margin-left:6px; }
</style>
</head>
<body>
  <h1>🕵️ AI Attacker Detection Dashboard</h1>
  <p class="sub">Juice Shop 앞단 detection-proxy — 2초마다 자동 갱신 · 행을 클릭하면 공격 경로(타임라인)를 볼 수 있습니다</p>
  <div class="toolbar">
    <a href="/__detection/api/export" target="_blank">⬇ 전체 로그 export (JSON)</a>
  </div>
  <table>
    <thead>
      <tr>
        <th>Session</th><th>IP</th><th>Score</th><th>Label</th>
        <th>Req#</th><th>AvgInt(ms)</th><th>URLdiv</th><th>404%</th>
        <th>Burst</th><th>UA/Header</th><th>Mouse</th><th>Scroll</th><th>DOMdiv</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="modal-backdrop" id="backdrop" onclick="closeModal(event)">
    <div class="modal" id="modal" onclick="event.stopPropagation()">
      <span class="close" onclick="closeModal()">✕ 닫기</span>
      <h2 id="modalTitle">공격 경로</h2>
      <div class="toolbar" id="modalExport"></div>
      <div id="pathList"></div>
    </div>
  </div>

<script>
let pollTimer = null;

async function refresh() {
  const res = await fetch('/__detection/api/sessions');
  const data = await res.json();
  const rows = document.getElementById('rows');
  rows.innerHTML = data
    .sort((a,b) => b.score - a.score)
    .map(s => `
      <tr class="session-row" onclick="openPath('${s.sessionId}')">
        <td><code>${s.sessionId.slice(0,8)}</code></td>
        <td>${s.ip}</td>
        <td>
          <span class="score-bar"><span class="score-fill" style="width:${Math.round(s.score*100)}%"></span></span>
          ${(s.score*100).toFixed(0)}%
        </td>
        <td><span class="badge ${s.label}">${s.label}</span></td>
        <td>${s.features.totalRequests}</td>
        <td>${s.features.avgIntervalMs.toFixed(0)}</td>
        <td>${s.features.urlDiversity.toFixed(2)}</td>
        <td>${(s.features.notFoundRatio*100).toFixed(0)}%</td>
        <td>${s.features.burstLength}</td>
        <td title="${s.features.userAgent}">${s.features.automationUA ? '⚠️ automation' : 'ok'} / miss:${s.features.missingHeaderCount}</td>
        <td>${s.features.mouseMoveCount}</td>
        <td>${s.features.scrollCount}</td>
        <td>${s.features.domEventDiversity}</td>
      </tr>
    `).join('');
}

function statusClass(status) {
  if (status >= 400) return 'status-404';
  if (status >= 200 && status < 300) return 'status-2xx';
  return '';
}

async function openPath(sessionId) {
  clearInterval(pollTimer);
  const res = await fetch(`/__detection/api/sessions/${sessionId}/path`);
  const data = await res.json();
  document.getElementById('modalTitle').textContent =
    `공격 경로 — ${sessionId.slice(0,8)} (${data.ip}) · ${data.requests.length}개 요청`;
  document.getElementById('modalExport').innerHTML =
    `<a href="/__detection/api/sessions/${sessionId}/path" target="_blank">⬇ 이 세션 로그 export (JSON)</a>`;
  document.getElementById('pathList').innerHTML = data.requests.map((r, i) => `
    <div class="path-item">
      <div class="meta">#${i+1} · ${new Date(r.ts).toLocaleTimeString()} · ${r.method}
        <span class="${statusClass(r.status)}">${r.status}</span>
        ${(r.tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}
      </div>
      <div class="url">${r.url}</div>
      ${r.body ? `<div class="body">body: ${typeof r.body === 'string' ? r.body : JSON.stringify(r.body)}</div>` : ''}
    </div>
  `).join('') || '<p>기록된 요청이 없습니다.</p>';
  document.getElementById('backdrop').style.display = 'block';
}

function closeModal(e) {
  document.getElementById('backdrop').style.display = 'none';
  pollTimer = setInterval(refresh, 2000);
}

refresh();
pollTimer = setInterval(refresh, 2000);
</script>
</body>
</html>
